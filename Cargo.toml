[package]
name = "inocode-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
tungstenite = { version = "0", default-features = false, features = ["handshake"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1"

# The GUI is run with optimizations (launch.ps1 uses this profile): the renderer is a CPU pixel
# loop and the markdown and layout code runs on every screen update. A dev build (opt-level 0) is
# many times slower. LTO is off to keep the build short; the runtime gain is in opt-level.
[profile.gui]
inherits = "release"
lto = false
codegen-units = 16
# The GUI is one crate: incremental keeps a one-file change at about half a minute and costs a
# few hundred MB (unlike the server's workspace, where it cost tens of GB).
incremental = true
panic = "abort"
strip = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Slint's winit backend 1.18.1 with one change (vendor/i-slint-backend-winit/renderer/sw.rs): the
# software renderer repaints the whole window every frame instead of only the dirty regions,
# whose misses left old text drawn under new text.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
